<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Panel del asesor — CDMX Agent</title>
<style>
  :root { --bg:#0b141a; --card:#111b21; --line:#22323b; --accent:#0F766E; --good:#5cffa6; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif; background:#0b141a; color:#e9edef; }
  header { padding:18px 24px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  header h1 { font-size:19px; margin:0; }
  header .src { font-size:12px; color:#8aa9b8; }
  header .spacer { flex:1; }
  header a { color:#7ee2c1; text-decoration:none; font-size:13px; border:1px solid var(--line); padding:7px 12px; border-radius:8px; }
  .wrap { padding:22px 24px; max-width:1100px; margin:0 auto; }
  .kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:14px; margin-bottom:24px; }
  .kpi { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px 18px; }
  .kpi .n { font-size:30px; font-weight:800; }
  .kpi .l { font-size:12px; color:#8aa9b8; text-transform:uppercase; letter-spacing:.5px; margin-top:4px; }
  .kpi.green .n { color:var(--good); }
  h2 { font-size:15px; color:#cfe3dd; margin:26px 0 10px; }
  table { width:100%; border-collapse:collapse; background:var(--card); border:1px solid var(--line); border-radius:12px; overflow:hidden; font-size:13.5px; }
  th, td { text-align:left; padding:10px 13px; border-bottom:1px solid var(--line); }
  th { background:#0c171d; color:#8aa9b8; font-weight:600; font-size:12px; text-transform:uppercase; letter-spacing:.4px; }
  tr:last-child td { border-bottom:0; }
  td b { color:#7ee2c1; }
  .empty { color:#6b7b83; padding:14px; font-size:13px; }
  .pill { background:#06351f; color:var(--good); padding:2px 9px; border-radius:999px; font-size:11px; font-weight:700; }
  .foot { color:#6b7b83; font-size:12px; text-align:center; padding:18px; }
</style>
</head>
<body>
  <header>
    <h1>📊 Panel del asesor</h1>
    <span class="src" id="src"></span>
    <div class="spacer"></div>
    <a href="/" target="_blank">Abrir chat ↗</a>
    <a href="#" onclick="load();return false">Actualizar ⟳</a>
  </header>
  <div class="wrap">
    <div class="kpis" id="kpis"></div>

    <h2>🏡 Leads inmobiliarios</h2>
    <table><thead><tr><th>Lead</th><th>Teléfono</th><th>Zona</th><th>Presupuesto</th><th>Propiedad</th><th>Score</th></tr></thead><tbody id="leads"></tbody></table>

    <h2>🗓️ Visitas agendadas</h2>
    <table><thead><tr><th>Folio</th><th>Zona</th><th>Fecha</th><th>Hora</th><th>Contacto</th></tr></thead><tbody id="bookings"></tbody></table>

    <h2>🌮 Pedidos (restaurante)</h2>
    <table><thead><tr><th>Folio</th><th>Artículos</th><th>Total</th><th>Tipo</th><th>Hora</th></tr></thead><tbody id="orders"></tbody></table>
  </div>
  <div class="foot">Datos generados en vivo por el agente · se actualiza automáticamente</div>

<script>
const $ = (id) => document.getElementById(id);
const usd = (n) => "$" + Number(n || 0).toLocaleString("en-US");
const esc = (s) => (s == null ? "" : String(s)).replace(/[&<>]/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;" }[c]));
const empty = (n) => `<tr><td colspan="${n}" class="empty">Aún no hay registros — completa una conversación en el chat.</td></tr>`;

async function load(){
  const d = await (await fetch("/api/dashboard")).json();
  $("src").textContent = "Inventario: " + (d.inventory || "—");
  const k = d.kpis;
  $("kpis").innerHTML = [
    ["Leads", k.leads, ""], ["Visitas", k.viewings, ""], ["Pedidos", k.orders, ""],
    ["Pipeline", usd(k.pipeline), "green"], ["Ingresos", usd(k.revenue), "green"],
  ].map(([l,n,c]) => `<div class="kpi ${c}"><div class="n">${n}</div><div class="l">${l}</div></div>`).join("");

  $("leads").innerHTML = d.leads.length ? d.leads.map(l =>
    `<tr><td><b>${esc(l.nombre)||"—"}</b></td><td>${esc(l.telefono)||"—"}</td><td>${esc(l.colonia)||"—"}</td><td>${l.presupuesto?usd(l.presupuesto):"—"}</td><td>${esc(l.listing_id)||"—"}</td><td><span class="pill">${esc(l.score)||"lead"}</span></td></tr>`).join("") : empty(6);

  $("bookings").innerHTML = d.bookings.length ? d.bookings.map(b =>
    `<tr><td><b>${esc(b.folio)}</b></td><td>${esc(b.colonia)||"—"}</td><td>${esc(b.fecha)||"—"}</td><td>${esc(b.hora)||"—"}</td><td>${esc(b.nombre)||""} ${esc(b.telefono)||""}</td></tr>`).join("") : empty(5);

  $("orders").innerHTML = d.orders.length ? d.orders.map(o =>
    `<tr><td><b>${esc(o.folio)}</b></td><td>${(o.items||[]).reduce((s,i)=>s+i.qty,0)} art.</td><td>$${Number(o.total).toLocaleString("es-MX")} MXN</td><td>${esc(o.tipo)||"—"}</td><td>${esc(o.hora)||"—"}</td></tr>`).join("") : empty(5);
}
load();
setInterval(load, 5000);
</script>
</body>
</html>
